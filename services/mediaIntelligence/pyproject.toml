[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltwin-media-intelligence"
version = "0.1.0"
description = "SkillTwin media intelligence service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.37.38",
    "jsonschema==4.23.0",
    "opencv-python-headless==4.11.0.86",
    "Pillow==11.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5"
]

[project.scripts]
skilltwin-media-intelligence = "mediaIntelligence.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
addopts = "-p no:asyncio"
