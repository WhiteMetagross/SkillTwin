[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltwin-media-intelligence"
version = "0.1.0"
description = "SkillTwin media intelligence service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.40.30",
    "jsonschema==4.25.1",
    "opencv-python-headless==4.12.0.88",
    "Pillow==11.3.0"
]

[project.optional-dependencies]
dev = [
    "imageio-ffmpeg==0.6.0",
    "pytest==8.4.2"
]

[project.scripts]
skilltwin-media-intelligence = "mediaIntelligence.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
addopts = "-p no:asyncio"
