[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltwin-skill-engine"
version = "0.1.0"
description = "SkillTwin skill engine service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.0,<2.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "pypdf>=6.0.0,<7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
skilltwin-skill-engine = "skillEngine.cli:main"
skilltwin-skill-engine-production = "skillEngine.production:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
addopts = "-p no:asyncio"
