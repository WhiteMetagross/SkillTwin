[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltwin-worker-coach"
version = "0.1.0"
description = "SkillTwin worker coach service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
skilltwin-worker-coach = "workerCoach.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
addopts = "-p no:asyncio"
