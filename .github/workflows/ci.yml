name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement services/mediaIntelligence/requirements.lock
          pip install pytest==8.3.5

      - name: Build TypeScript packages
        run: npm run build

      - name: Validate contract fixtures
        run: npm run validate:fixtures

      - name: Run TypeScript unit tests
        run: |
          npm run test:contracts
          npm run test:api
          npm run test:pdf

      - name: Run media intelligence tests
        run: pytest services/mediaIntelligence

      - name: Build media intelligence container
        run: docker build --file services/mediaIntelligence/Dockerfile --tag skilltwin-media:test .

      - name: Smoke test media intelligence container
        run: docker run --rm skilltwin-media:test python tests/containerSmoke.py

      - name: Run skill engine tests
        run: pytest services/skillEngine

      - name: Run worker coach tests
        run: pytest services/workerCoach
